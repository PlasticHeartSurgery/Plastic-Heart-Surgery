<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Heart Surgery — Links</title>
    <style>
        @font-face {
            font-family: 'Lyno Ulyscyr';
            src: local('Lyno Ulyscyr'), url('fonts/lynoulyscyr.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Hybrid';
            src: local('Hybrid'), url('fonts/Hybrid.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
        }

        .sidebar {
            width: 340px;
            background-color: #ffffff;
            border-right: none;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            top: 0;
            left: 0;
            overflow-y: auto;
        }

        .site-title {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #ff0033;
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
        }

        .nav-columns {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-column-item {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.2em;
            color: #333333;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-column-item:hover, .nav-column-item.active {
            color: #ff0033;
        }

        .sidebar-footer {
            font-size: 0.85rem;
            color: #333333;
            word-break: break-all;
            margin-top: 30px;
        }

        .sidebar-footer a {
            color: #ff0033;
            text-decoration: none;
        }

        .sidebar-footer a:hover {
            text-decoration: underline;
        }

        main {
            margin-left: 340px;
            flex: 1;
            padding: 80px 60px;
            max-width: 950px;
            background-color: #ffffff;
        }

        h2 {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 0.25em;
            color: #ff0033;
            margin-bottom: 24px;
        }

        p {
            color: #222222;
            margin-bottom: 24px;
            font-size: 1rem;
        }

        /* Links Grid */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        /* Hyperlink Box with Animated Gradient Glow */
        .link-card {
            display: block;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            padding: 24px;
            text-decoration: none;
            box-shadow: 4px 4px 0px #000000;
            position: relative;
            z-index: 1;
            transition: transform 0.2s ease, border-color 0.4s ease, background-color 0.4s ease;
        }

        .link-card:hover {
            border-color: #ff0033;
            transform: translateY(-2px);
            animation: gradientGlow 3s ease-in-out infinite alternate;
        }

        @keyframes gradientGlow {
            0% {
                background-color: #ffffff;
                box-shadow: 0px 0px 5px rgba(255, 255, 255, 0.8), 4px 4px 0px #ff0033;
            }
            50% {
                background-color: #fff5f7;
                box-shadow: 0px 0px 20px rgba(255, 0, 51, 0.35), 4px 4px 0px #ff0033;
            }
            100% {
                background-color: #ffe6eb;
                box-shadow: 0px 0px 35px rgba(255, 0, 51, 0.7), 4px 4px 0px #ff0033;
            }
        }

        .link-tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ff0033;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .link-title {
            font-family: 'Hybrid', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            color: #111111;
            margin-bottom: 8px;
        }

        .link-desc {
            font-size: 0.95rem;
            color: #444444;
        }

        /* PayPal Widget Styles */
        .paypal-widget-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            padding: 24px;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.2s ease, border-color 0.4s ease, background-color 0.4s ease;
        }
        .paypal-widget-card:hover {
            border-color: #ff0033;
            animation: gradientGlow 3s ease-in-out infinite alternate;
        }
        .paypal-widget-card .link-title a {
            color: inherit;
            text-decoration: none;
        }
        .paypal-widget-card .link-title a:hover {
            text-decoration: underline;
        }

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
