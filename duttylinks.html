<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Heart Surgery — Card</title>
    <style>
        @font-face {
            font-family: 'Frostgiant3D';
            src: local('Frostgiant3D'), url('fonts/frostgiant3d.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientGlow {
            0% {
                background-color: #ffffff;
                box-shadow: 0px 0px 5px rgba(255, 255, 255, 0.8), 4px 4px 0px #ff0033;
            }
            50% {
                background-color: #fff5f7;
                box-shadow: 0px 0px 20px rgba(255, 0, 51, 0.35), 4px 4px 0px #ff0033;
            }
            100% {
                background-color: #ffe6eb;
                box-shadow: 0px 0px 35px rgba(255, 0, 51, 0.7), 4px 4px 0px #ff0033;
            }
        }

        .link-card {
            display: block;
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            padding: 24px;
            text-decoration: none;
            box-shadow: 4px 4px 0px #000000;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.4s ease, background-color 0.4s ease;
        }

        .link-card:hover {
            border-color: #ff0033;
            transform: translateY(-2px);
            animation: gradientGlow 3s ease-in-out infinite alternate;
        }

        .link-tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ff0033;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .link-title {
            font-family: 'Frostgiant3D', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            color: #111111;
            margin-bottom: 8px;
        }

        .link-desc {
            font-size: 0.95rem;
            color: #444444;
        }
    </style>
</head>
<body>

    <div class="link-card" onclick="playClickSound('audio/Sound 1.mp3')">
        <div class="link-tag">Tag</div>
        <div class="link-title">Card Title</div>
        <div class="link-desc">Click this card to play the sound effect.</div>
    </div>

    <script>
        function playClickSound(soundPath) {
            const clickSound = new Audio(soundPath);
            clickSound.volume = 0.5;
            clickSound.currentTime = 0;
            clickSound.play().catch(error => {
                console.log("Audio playback error:", error);
            });
        }
    </script>

</body>
</html>
