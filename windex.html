<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Flipping Cards with Images</title>
    <style>
        @font-face {
            font-family: 'Black Witcher';
            src: url('fonts/Black Witcher.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
            color: #38bdf8;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        /* Grid Layout for the 4 Boxes */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            perspective: 1000px; /* Required for 3D flip effect */
        }

        /* Card Wrapper / Box */
        .card-box {
            background-color: transparent;
            height: 320px;
            cursor: pointer;
        }

        /* Inner Card that rotates */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }

        /* Flipped state triggered by JS class */
        .card-box.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* Common styles for Front and Back faces */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        /* Front Face Style */
        .card-front {
            background: #1e293b;
            color: #ffffff;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 12px;
        }

        .card-front .overlay-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            padding: 12px;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: #f8fafc;
        }

        /* Back Face Style */
        .card-back {
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-back h3 {
            font-family: 'Black Witcher', sans-serif;
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }

        .card-back p {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e0f2fe;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Interactive Gallery Cards</h1>
        <p class="subtitle">Click any card to check selection.</p>

        <div class="card-grid">
            <!-- Card 1 -->
            <div class="card-box" data-redirect="https://plasticheartsurgery.com/index" onclick="handleCardClick(this)">
                <div class="card-inner">
                    <div class="card-front">
                        <img src="images/image1.jpg" alt="Gallery Image 1">
                        <div class="overlay-text">Card 1</div>
                    </div>
                    <div class="card-back">
                        <h3>Wrong Card</h3>
                        <p>Redirecting soon...</p>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card-box" data-redirect="https://plasticheartsurgery.com/windex2" onclick="handleCardClick(this)">
                <div class="card-inner">
                    <div class="card-front">
                        <img src="images/image2.jpg" alt="Gallery Image 2">
                        <div class="overlay-text">Card 2</div>
                    </div>
                    <div class="card-back">
                        <h3>Wrong Card</h3>
                        <p>Redirecting soon...</p>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card-box" data-redirect="https://plasticheartsurgery.com/index" onclick="handleCardClick(this)">
                <div class="card-inner">
                    <div class="card-front">
                        <img src="images/image3.jpg" alt="Gallery Image 3">
                        <div class="overlay-text">Card 3</div>
                    </div>
                    <div class="card-back">
                        <h3>Wrong Card</h3>
                        <p>Redirecting soon...</p>
                    </div>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="card-box" data-redirect="https://plasticheartsurgery.com/index" onclick="handleCardClick(this)">
                <div class="card-inner">
                    <div class="card-front">
                        <img src="images/image4.jpg" alt="Gallery Image 4">
                        <div class="overlay-text">Card 4</div>
                    </div>
                    <div class="card-back">
                        <h3>Wrong Card</h3>
                        <p>Redirecting soon...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleCardClick(cardBox) {
            // Prevent multiple clicks while a sequence is already running
            if (cardBox.classList.contains('flipped') || cardBox.dataset.processing) return;
            cardBox.dataset.processing = "true";

            // 1. Flip the card
            cardBox.classList.add('flipped');
            const redirectUrl = cardBox.getAttribute('data-redirect');

            // 2. After 5 seconds, unflip the card back to the photo
            setTimeout(() => {
                cardBox.classList.remove('flipped');

                // 3. 1 second after un flipping (total 6 seconds), redirect to the page
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);

            }, 5000);
        }
    </script>

</body>
</html>
