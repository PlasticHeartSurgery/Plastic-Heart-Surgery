<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Page Red Explosion</title>
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: default;
        }

        /* Invisible full-screen interactive zone acting as the trigger area */
        #trigger-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="trigger-zone"></div>
    <canvas id="particle-canvas"></canvas>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const triggerZone = document.getElementById('trigger-zone');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        let mouseX = 0;
        let mouseY = 0;
        let isOverCard = false;

        triggerZone.addEventListener('mousemove', (e) => {
            isOverCard = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        triggerZone.addEventListener('mouseleave', () => {
            isOverCard = false;
        });

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                // Random angle in full 360 degrees
                const angle = Math.random() * Math.PI * 2;
                // High velocity range for explosive spread
                const speed = Math.random() * 15 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                // Pure red variations (no white, only RGB red channel active)
                this.red = Math.floor(Math.random() * 155) + 100;
                this.size = Math.random() * 3 + 1.5;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.01;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
