<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Heart Surgery — Visual Arts</title>
    <style>
        @font-face {
            font-family: 'Lyno Ulyscyr';
            src: local('Lyno Ulyscyr'), url('fonts/lynoulyscyr.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff !important;
            color: #111111 !important;
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
        }

        sidebar {
            width: 340px;
            background-color: #ffffff !important;
            border-right: 1px solid #cccccc;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            top: 0;
            left: 0;
            overflow-y: auto;
        }

        .site-title {
            font-family: 'Lyno Ulyscyr', sans-serif !important;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #ff0033 !important;
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
        }

        .nav-columns {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .nav-column-item {
            font-family: 'Lyno Ulyscyr', sans-serif !important;
            font-size: 1.25rem;
            letter-spacing: 0.2em;
            color: #555555 !important;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-column-item:hover, .nav-column-item.active {
            color: #ff0033 !important;
        }

        .sidebar-footer {
            font-size: 0.85rem;
            color: #333333 !important;
            word-break: break-all;
            margin-top: 40px;
        }

        .sidebar-footer a {
            color: #ff0033 !important;
            text-decoration: none;
        }

        .sidebar-footer a:hover {
            text-decoration: underline;
        }

        main {
            margin-left: 340px;
            flex: 1;
            padding: 80px 60px;
            max-width: 1000px;
            background-color: #ffffff !important;
        }

        h2 {
            font-family: 'Lyno Ulyscyr', sans-serif !important;
            font-size: 1.8rem;
            letter-spacing: 0.25em;
            color: #ff0033 !important;
            margin-bottom: 24px;
        }

        p {
            color: #444444 !important;
            margin-bottom: 24px;
            font-size: 1rem;
        }

        /* Visual Arts Grid Layout with Sublinks */
        .art-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .art-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            overflow: hidden;
            text-decoration: none;
            display: block;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .art-card:hover {
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px #ff0033;
            border-color: #ff0033;
        }

        .art-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .art-info {
            padding: 16px;
            background-color: #ffffff;
        }

        .art-title {
            font-family: 'Lyno Ulyscyr', sans-serif !important;
            font-size: 1.05rem;
            letter-spacing: 0.15em;
            color: #ff0033 !important;
            margin-bottom: 6px;
        }

        .art-meta {
            font-size: 0.85rem;
            color: #555555;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            sidebar {
                position: relative;
                width: 100%;
                height: auto;
                padding: 30px 20px;
                border-right: none;
                border-bottom: 1px solid #cccccc;
            }
            main {
                margin-left: 0;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body style="background-color: #ffffff !important;">

    <sidebar style="background-color: #ffffff !important;">
        <div>
            <a href="index.html" class="site-title">Plastic Heart Surgery</a>
            <div class="nav-columns">
                <a href="index.html" class="nav-column-item">Bio</a>
                <a href="visualarts.html" class="nav-column-item active">Visual Arts</a>
                <a href="music.html" class="nav-column-item">Music</a>
                <a href="links.html" class="nav-column-item">Links</a>
            </div>
        </div>
        <div class="sidebar-footer">
            <p style="margin-bottom: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #000000;">Contact</p>
            <a href="mailto:plasticheartsurgery@gmail.com">plasticheartsurgery@gmail.com</a>
        </div>
    </sidebar>

    <main style="background-color: #ffffff !important;">
        <section>
            <h2>Visual Arts</h2>
            <p>Selected large-scale canvas pieces, mixed-media, and visual projects.</p>
            
            <div class="art-grid">
                <!-- Piece 1 -->
                <a href="artwork-monster.html" class="art-card">
                    <img src="images/And Now She Is a Monster - Brighter - 3000 x 3000.png" alt="And Now She Is a Monster">
                    <div class="art-info">
                        <div class="art-title">And Now She Is a Monster</div>
                        <div class="art-meta">Mixed-media on canvas ↗</div>
                    </div>
                </a>

                <!-- Piece 2 (Duplicate and customize for additional pieces) -->
                <a href="artwork-piece-two.html" class="art-card">
                    <img src="images/YOUR-SECOND-IMAGE-NAME.png" alt="Artwork Title">
                    <div class="art-info">
                        <div class="art-title">Piece Title Here</div>
                        <div class="art-meta">Medium / Details ↗</div>
                    </div>
                </a>
            </div>
        </section>
    </main>

</body>
</html>
