    <style>
        @font-face {
            font-family: 'Lyno Ulyscyr';
            src: local('Lyno Ulyscyr'), url('fonts/lynoulyscyr.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
            transition: background-color 0.1s ease;
        }

        /* --- EXTENDED GLITCH & 10-SECOND STROBE TRANSITION --- */
        body.glitch-transition {
            animation: 
                fullPageMeltdown 3s forwards ease-in-out, 
                strobeLight 10s 3s forwards steps(1); /* 3s delay for meltdown, then 10s strobe */
            pointer-events: none;
        }

        @keyframes fullPageMeltdown {
            0% {
                transform: skewX(0deg) translateY(0px) scale(1);
                filter: blur(0px) contrast(100%);
            }
            25% {
                transform: skewX(-12deg) translateY(15px) scale(1.02);
                filter: blur(2px) contrast(150%) hue-rotate(90deg);
            }
            50% {
                transform: skewX(20deg) translateY(-25px) scale(0.98) rotate(1deg);
                filter: blur(5px) contrast(200%) hue-rotate(180deg) invert(15%);
            }
            75% {
                transform: skewX(-25deg) translateY(30px) scale(1.05);
                filter: blur(8px) contrast(250%) hue-rotate(270deg) invert(50%);
            }
            100% {
                transform: skewX(-40deg) translateY(50px) scale(1.1);
                filter: blur(12px) contrast(300%) invert(100%);
            }
        }

        @keyframes strobeLight {
            0%   { background-color: #ff0033; color: #ffffff; }
            5%   { background-color: #0000ff; color: #ffffff; }
            10%  { background-color: #ff0033; color: #000000; }
            15%  { background-color: #0000ff; color: #ff0033; }
            20%  { background-color: #ff0033; color: #ffffff; }
            25%  { background-color: #0000ff; color: #ffffff; }
            30%  { background-color: #ff0033; color: #000000; }
            35%  { background-color: #0000ff; color: #ff0033; }
            40%  { background-color: #ff0033; color: #ffffff; }
            45%  { background-color: #0000ff; color: #ffffff; }
            50%  { background-color: #ff0033; color: #000000; }
            55%  { background-color: #0000ff; color: #ff0033; }
            60%  { background-color: #ff0033; color: #ffffff; }
            65%  { background-color: #0000ff; color: #ffffff; }
            70%  { background-color: #ff0033; color: #000000; }
            75%  { background-color: #0000ff; color: #ff0033; }
            80%  { background-color: #ff0033; color: #ffffff; }
            85%  { background-color: #0000ff; color: #ffffff; }
            90%  { background-color: #ff0033; color: #000000; }
            95%  { background-color: #0000ff; color: #ff0033; }
            100% { background-color: #000000; color: #000000; opacity: 0; }
        }
