<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Heart Surgery — Bio</title>
    <style>
        @font-face {
            font-family: 'Lyno Ulyscyr';
            src: local('Lyno Ulyscyr'), url('fonts/lynoulyscyr.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), filter 0.8s ease;
        }

        /* --- SERUM 2 GLITCH PAGE MELT EFFECT ON CLICK --- */
        body.glitch-transition {
            animation: fullPageMeltdown 0.8s forwards ease-in-out;
            pointer-events: none;
        }

        @keyframes fullPageMeltdown {
            0% {
                transform: skewX(0deg) translateY(0px) scale(1);
                filter: blur(0px) contrast(100%);
            }
            30% {
                transform: skewX(-15deg) translateY(20px) scale(1.02);
                filter: blur(2px) contrast(150%) hue-rotate(90deg);
            }
            60% {
                transform: skewX(25deg) translateY(-40px) scale(0.98) rotate(1deg);
                filter: blur(6px) contrast(200%) hue-rotate(180deg) invert(15%);
            }
            100% {
                transform: skewX(-40deg) translateY(100px) scale(1.1);
                filter: blur(15px) contrast(300%) invert(100%);
                opacity: 0;
            }
        }

        .sidebar {
            width: 340px;
            background-color: #ffffff;
            border-right: none;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            top: 0;
            left: 0;
            overflow-y: auto;
        }

        .site-title {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #ff0033;
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
        }

        .nav-columns {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-column-item {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.2em;
            color: #333333;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-column-item:hover, .nav-column-item.active {
            color: #ff0033;
        }

        .sidebar-footer {
            font-size: 0.85rem;
            color: #333333;
            word-break: break-all;
            margin-top: 30px;
        }

        .sidebar-footer a {
            color: #ff0033;
            text-decoration: none;
        }

        .sidebar-footer a:hover {
            text-decoration: underline;
        }

        main {
            margin-left: 340px;
            flex: 1;
            padding: 80px 60px;
            max-width: 950px;
            background-color: #ffffff;
        }

        h2 {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 0.25em;
            color: #ff0033;
            margin-bottom: 24px;
        }

        p {
            color: #222222;
            margin-bottom: 16px;
            font-size: 1rem;
        }

        .bio-container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            margin-top: 20px;
        }

        .bio-text {
            flex: 1;
        }

        .bio-image-frame {
            width: 300px;
            flex-shrink: 0;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 4px 4px 0px #000000;
        }

        .bio-image-frame img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 900px) {
            .bio-container {
                flex-direction: column-reverse;
            }
            .bio-image-frame {
                width: 100%;
                max-width: 400px;
                margin-bottom: 30px;
            }
        }

                flex-direction: column;

                position: relative;

                padding: 30px 20px;
                border-right: none;
                border-bottom: none;
            }

                margin-left: 0;
                padding: 40px 20px;
                max-width: 100%;
