<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plastic Heart Surgery — Music</title>
    <style>
        @font-face {
            font-family: 'Lyno Ulyscyr';
            src: local('Lyno Ulyscyr'), url('fonts/lynoulyscyr.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Movie Poster Bold';
            src: local('SF Movie Poster Bold'), url('fonts/SF Movie Poster Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* --- CENTERED GRADIENT LOADING BAR --- */
        .loader-container {
            position: fixed;
            top: 50%;
            left: calc(340px + ((100vw - 340px) / 2));
            transform: translate(-50%, -50%);
            width: min(300px, 80vw);
            height: 10px;
            background-color: #f0f0f0;
            border: 2px solid #000000;
            border-radius: 999px;
            overflow: hidden;
            box-shadow: 3px 3px 0px #000000;
            z-index: 9999;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #ffffff, #ff0033);
            border-radius: 999px;
            transition: width 0.1s ease-out;
        }

        body.images-loaded .loader-container {
            opacity: 0;
            visibility: hidden;
        }

        .sidebar {
            width: 340px;
            background-color: #ffffff;
            border-right: none;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            top: 0;
            left: 0;
            overflow-y: auto;
            z-index: 10;
        }

        .site-title {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            color: #ff0033;
            margin-bottom: 40px;
            text-decoration: none;
            display: block;
        }

        .nav-columns {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .nav-column-item {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.2em;
            color: #333333;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-column-item:hover, .nav-column-item.active {
            color: #ff0033;
        }

        .sidebar-footer {
            font-size: 0.85rem;
            color: #333333;
            word-break: break-all;
            margin-top: 30px;
        }

        .sidebar-footer a {
            color: #ff0033;
            text-decoration: none;
        }

        .sidebar-footer a:hover {
            text-decoration: underline;
        }

        main {
            margin-left: 340px;
            flex: 1;
            padding: 80px 60px;
            max-width: 950px;
            background-color: #ffffff;
        }

        h2 {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 0.25em;
            color: #ff0033;
            margin-bottom: 24px;
        }

        /* Visualizer Box */
        .visualizer-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 4px 4px 0px #000000;
            margin-bottom: 30px;
        }

        .visualizer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .visualizer-status {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #ff0033;
            font-weight: 700;
        }

        .visualizer-time {
            font-family: monospace;
            font-size: 0.85rem;
            color: #333333;
        }

        #audioVisualizer {
            width: 100%;
            height: 140px;
            display: block;
            background-color: #fff5f7;
            border: 1px solid #000000;
            border-radius: 4px;
        }

        /* Scrubbable Progress Bar */
        .progress-bar-wrapper {
            padding: 8px 0;
            margin-top: 6px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
        }

        .progress-bar-container {
            position: relative;
            width: 100%;
            height: 10px;
            background: #eeeeee;
            border: 1px solid #000000;
            border-radius: 4px;
            transition: height 0.15s ease;
        }

        .progress-bar-wrapper:hover .progress-bar-container,
        .progress-bar-wrapper.dragging .progress-bar-container {
            height: 14px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #ff0033;
            border-radius: 3px 0 0 3px;
            pointer-events: none;
        }

        .progress-handle {
            position: absolute;
            top: 50%;
            left: 0%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 50%;
            box-shadow: 2px 2px 0px #000000;
            opacity: 0;
            transition: opacity 0.15s ease, background-color 0.15s ease;
            pointer-events: none;
        }

        .progress-bar-wrapper:hover .progress-handle,
        .progress-bar-wrapper.dragging .progress-handle {
            opacity: 1;
            background: #ff0033;
        }

        /* Track Grid */
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        /* Clickable Track Card */
        .track-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            padding: 24px;
            box-shadow: 4px 4px 0px #000000;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease, border-color 0.4s ease, background-color 0.4s ease;
        }

        .track-card:hover, .track-card.playing {
            border-color: #ff0033;
            transform: translateY(-2px);
            animation: gradientGlow 3s ease-in-out infinite alternate;
        }

        @keyframes gradientGlow {
            0% {
                background-color: #ffffff;
                box-shadow: 0px 0px 5px rgba(255, 255, 255, 0.8), 4px 4px 0px #ff0033;
            }
            50% {
                background-color: #fff5f7;
                box-shadow: 0px 0px 20px rgba(255, 0, 51, 0.35), 4px 4px 0px #ff0033;
            }
            100% {
                background-color: #ffe6eb;
                box-shadow: 0px 0px 35px rgba(255, 0, 51, 0.7), 4px 4px 0px #ff0033;
            }
        }

        .link-tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ff0033;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .link-title {
            font-family: 'SF Movie Poster Bold', sans-serif !important;
            font-size: 1.5rem;
            letter-spacing: 0.12em;
            color: #111111;
            margin-bottom: 4px;
        }

        .play-indicator {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.15em;
            color: #111111;
            border: 2px solid #000000;
            padding: 8px 16px;
            border-radius: 4px;
            background: #ffffff;
            min-width: 100px;
            text-align: center;
        }

        .track-card.playing .play-indicator {
            background: #ff0033;
            color: #ffffff;
            border-color: #ff0033;
        }

        /* --- FULL-PAGE STACKED ART CARDS --- */
        .art-stack {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .art-card {
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 6px 6px 0px #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            cursor: zoom-in;
            opacity: 0;
            transform: translateY(20px);
            transition: 
                opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }

        body.images-loaded .art-card {
            opacity: 1;
            transform: translateY(0);
        }

        @media (hover: hover) {
            .art-card:hover {
                border-color: #ff0033;
                box-shadow: 10px 10px 0px #ff0033;
            }
        }

        .art-image-frame {
            width: 100%;
            background: #f0f0f0;
            overflow: hidden;
            border-bottom: 2px solid #000000;
            cursor: zoom-in;
            position: relative;
        }

        .art-card:hover .art-image-frame {
            border-bottom-color: #ff0033;
        }

        .art-image-frame img {
            width: 100%;
            height: auto;
            min-height: 75vh;
            max-height: 85vh;
            display: block;
            object-fit: contain;
            background: #fafafa;
        }

        .art-info {
            padding: 20px 24px;
            background: #ffffff;
        }

        .art-title {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.2em;
            color: #ff0033;
            margin-bottom: 0;
        }

        /* --- ALMOST-FULLSCREEN LIGHTBOX MODAL --- */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 17, 17, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .lightbox-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-window {
            position: relative;
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 6px;
            box-shadow: 10px 10px 0px #ff0033;
            max-width: 95vw;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.96);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox-overlay.open .lightbox-window {
            transform: scale(1);
        }

        .lightbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #ffffff;
            border-bottom: 2px solid #000000;
            gap: 20px;
        }

        .lightbox-title {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.2em;
            color: #ff0033;
        }

        .lightbox-close {
            font-family: 'Lyno Ulyscyr', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            color: #111111;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .lightbox-close:hover {
            background: #ff0033;
            color: #ffffff;
            border-color: #ff0033;
        }

        .lightbox-body {
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f7;
            max-height: calc(95vh - 56px);
        }

        .lightbox-body img {
            display: block;
            max-width: 93vw;
            max-height: calc(95vh - 60px);
            width: auto;
            height: auto;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                padding: 30px 20px;
            }
            main {
                margin-left: 0;
                padding: 40px 20px;
                max-width: 100%;
            }
            .loader-container {
                left: 50%;
            }
            .site-title {
                font-size: 1.2rem;
                letter-spacing: 0.15em;
            }
            h2 {
                font-size: 1.4rem;
                letter-spacing: 0.15em;
            }
            .track-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .art-image-frame img {
                min-height: 50vh;
                max-height: 70vh;
            }
            .lightbox-overlay {
                padding: 10px;
            }
            .lightbox-window {
                max-width: 98vw;
                max-height: 96vh;
            }
            .lightbox-body img {
                max-width: 96vw;
                max-height: calc(96vh - 56px);
            }
        }
    </style>
</head>
<body>

    <!-- Centered White-to-Red Gradient Loading Bar -->
    <div class="loader-container">
        <div class="loader-bar" id="loader-bar"></div>
    </div>

    <div class="sidebar">
        <div>
            <a href="index.html" class="site-title">Plastic Heart Surgery</a>
            <div class="nav-columns">
                <a href="hidden.html" class="nav-column-item active">Plastic Heart Surgery</a>
                <a href="hidden.html" class="nav-column-item">Visual Arts</a>
                <a href="music.html" class="nav-column-item">Music</a>
                <a href="tourdates.html" class="nav-column-item">Tour Dates</a>
                <a href="comingupshows.html" class="nav-column-item">Coming Up Shows</a>
                <a href="bigfanof....html" class="nav-column-item">Big Fan Of</a>
                <a href="links.html" class="nav-column-item">Links</a>
            </div>
        </div>
        <div class="sidebar-footer">
            <p style="margin-bottom: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #000000;">Contact</p>
            <a href="mailto:plasticheartsurgery@gmail.com">plasticheartsurgery@gmail.com</a>
        </div>
    </div>

    <main>
        <section>
            <h2>Plastic Heart Surgery</h2>

            <!-- Audio Visualizer -->
            <div class="visualizer-card">
                <div class="visualizer-header">
                    <span class="visualizer-status" id="vizStatus">Ready — Click a card to play</span>
                    <span class="visualizer-time" id="vizTime">00:00 / 00:00</span>
                </div>
                <canvas id="audioVisualizer"></canvas>
                <div class="progress-bar-wrapper" id="progressWrapper" tabindex="0" role="slider" aria-label="Seek audio position">
                    <div class="progress-bar-container" id="progressContainer">
                        <div class="progress-bar-fill" id="progressFill"></div>
                        <div class="progress-handle" id="progressHandle"></div>
                    </div>
                </div>
            </div>

            <!-- Clickable Track Cards Grid -->
            <div class="links-grid">

                <!-- Eel (Instrumental) Track Card -->
                <div class="track-card" data-src="audio/Eel (Instrumental).mp3" data-title="Eel (Instrumental)" onclick="toggleTrack(this)">
                    <div>
                        <div class="link-tag">Track 01</div>
                        <div class="link-title">Eel (Instrumental)</div>
                    </div>
                    <div class="play-indicator">PLAY</div>
                </div>

            </div>

            <!-- Full-Page Stacked Art Cards (Eel 1 at top, Eel 3 at bottom) -->
            <div class="art-stack">

                <!-- Eel 1 -->
                <div class="art-card" onclick="openLightbox('images/Eel 1.png', 'Eel 1')">
                    <div class="art-image-frame">
                        <img src="images/Eel 1.png" alt="Eel 1">
                    </div>
                    <div class="art-info">
                        <div class="art-title">Eel 1</div>
                    </div>
                </div>

                <!-- Eel 2 -->
                <div class="art-card" onclick="openLightbox('images/Eel 2.png', 'Eel 2')">
                    <div class="art-image-frame">
                        <img src="images/Eel 2.png" alt="Eel 2">
                    </div>
                    <div class="art-info">
                        <div class="art-title">Eel 2</div>
                    </div>
                </div>

                <!-- Eel 3 -->
                <div class="art-card" onclick="openLightbox('images/Eel 3.png', 'Eel 3')">
                    <div class="art-image-frame">
                        <img src="images/Eel 3.png" alt="Eel 3">
                    </div>
                    <div class="art-info">
                        <div class="art-title">Eel 3</div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Almost-Fullscreen Image Lightbox Modal -->
    <div class="lightbox-overlay" id="lightboxOverlay" onclick="handleLightboxBackdrop(event)">
        <div class="lightbox-window">
            <div class="lightbox-header">
                <span class="lightbox-title" id="lightboxTitle">Eel 1</span>
                <button class="lightbox-close" type="button" onclick="closeLightbox()">CLOSE [ESC]</button>
            </div>
            <div class="lightbox-body">
                <img id="lightboxImg" src="" alt="">
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioPlayer" crossorigin="anonymous" preload="metadata"></audio>

    <script>
        /* --- LIGHTBOX MODAL LOGIC --- */
        const lightboxOverlay = document.getElementById('lightboxOverlay');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxTitle = document.getElementById('lightboxTitle');

        function openLightbox(src, title) {
            lightboxImg.src = src;
            lightboxImg.alt = title;
            lightboxTitle.textContent = title;
            lightboxOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightboxOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        function handleLightboxBackdrop(e) {
            if (e.target === lightboxOverlay) {
                closeLightbox();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightboxOverlay.classList.contains('open')) {
                closeLightbox();
            }
        });

        /* --- AUDIO VISUALIZER & TRACK PLAYER --- */
        const audio = document.getElementById('audioPlayer');
        const canvas = document.getElementById('audioVisualizer');
        const ctx = canvas.getContext('2d');
        const vizStatus = document.getElementById('vizStatus');
        const vizTime = document.getElementById('vizTime');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressHandle = document.getElementById('progressHandle');

        let audioCtx = null;
        let analyser = null;
        let source = null;
        let activeCard = null;
        let currentLoadedSrc = '';
        let isDraggingProgress = false;
        let demoOscillator = null;
        let demoInterval = null;
        let isDemoPlaying = false;

        const firstCard = document.querySelector('.track-card');
        if (firstCard) {
            currentLoadedSrc = firstCard.getAttribute('data-src');
            audio.src = currentLoadedSrc;
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;

                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function stopDemoSynth() {
            if (demoOscillator) {
                try { demoOscillator.stop(); } catch (e) {}
                demoOscillator.disconnect();
                demoOscillator = null;
            }
            if (demoInterval) {
                clearInterval(demoInterval);
                demoInterval = null;
            }
            isDemoPlaying = false;
        }

        function startDemoSynth(title) {
            stopDemoSynth();
            isDemoPlaying = true;
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.08;

            demoOscillator = audioCtx.createOscillator();
            demoOscillator.type = 'sawtooth';
            demoOscillator.frequency.setValueAtTime(55, audioCtx.currentTime);

            demoOscillator.connect(gainNode);
            gainNode.connect(analyser);
            gainNode.connect(audioCtx.destination);
            demoOscillator.start();

            const notes = [55, 65.41, 73.42, 82.41, 55, 98.00, 73.42, 65.41];
            let step = 0;
            demoInterval = setInterval(() => {
                if (demoOscillator && audioCtx) {
                    demoOscillator.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    step++;
                }
            }, 220);

            vizStatus.textContent = `Visualizing Preview (File Not Found): ${title}`;
        }

        function toggleTrack(card) {
            initAudioContext();
            const src = card.getAttribute('data-src');
            const title = card.getAttribute('data-title') || 'Track';

            if (activeCard === card && (!audio.paused || isDemoPlaying)) {
                audio.pause();
                stopDemoSynth();
                card.classList.remove('playing');
                card.querySelector('.play-indicator').textContent = 'PLAY';
                vizStatus.textContent = `Paused: ${title}`;
                return;
            }

            document.querySelectorAll('.track-card').forEach(c => {
                c.classList.remove('playing');
                c.querySelector('.play-indicator').textContent = 'PLAY';
            });
            stopDemoSynth();

            activeCard = card;
            card.classList.add('playing');
            card.querySelector('.play-indicator').textContent = 'PAUSE';
            vizStatus.textContent = `Loading: ${title}...`;

            if (currentLoadedSrc !== src) {
                audio.src = src;
                currentLoadedSrc = src;
            }

            audio.play().then(() => {
                vizStatus.textContent = `Now Playing: ${title}`;
            }).catch(() => {
                startDemoSynth(title);
            });
        }

        function updateProgressUI(pct) {
            const clamped = Math.max(0, Math.min(100, pct));
            progressFill.style.width = `${clamped}%`;
            progressHandle.style.left = `${clamped}%`;
        }

        function seekFromClientX(clientX) {
            if (!audio.duration || isNaN(audio.duration)) return;
            const rect = progressContainer.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const targetTime = ratio * audio.duration;
            audio.currentTime = targetTime;
            updateProgressUI(ratio * 100);
            vizTime.textContent = `${formatTime(targetTime)} / ${formatTime(audio.duration)}`;
        }

        progressWrapper.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            progressWrapper.classList.add('dragging');
            seekFromClientX(e.clientX);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingProgress) return;
            seekFromClientX(e.clientX);
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingProgress) {
                isDraggingProgress = false;
                progressWrapper.classList.remove('dragging');
            }
        });

        progressWrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDraggingProgress = true;
                progressWrapper.classList.add('dragging');
                seekFromClientX(e.touches[0].clientX);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDraggingProgress || e.touches.length !== 1) return;
            seekFromClientX(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchend', () => {
            if (isDraggingProgress) {
                isDraggingProgress = false;
                progressWrapper.classList.remove('dragging');
            }
        });

        progressWrapper.addEventListener('keydown', (e) => {
            if (!audio.duration || isNaN(audio.duration)) return;
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                audio.currentTime = Math.max(0, audio.currentTime - 5);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            if (!isNaN(audio.duration)) {
                vizTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration || isDraggingProgress) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            updateProgressUI(pct);
            vizTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        });

        audio.addEventListener('ended', () => {
            if (activeCard) {
                activeCard.classList.remove('playing');
                activeCard.querySelector('.play-indicator').textContent = 'PLAY';
            }
            vizStatus.textContent = 'Finished';
            updateProgressUI(0);
        });

        function formatTime(sec) {
            if (isNaN(sec)) return '00:00';
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;

            ctx.clearRect(0, 0, width, height);

            if (!analyser) {
                ctx.fillStyle = '#ff0033';
                ctx.fillRect(0, height / 2 - 1, width, 2);
                return;
            }

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const barWidth = (width / bufferLength) * 1.6;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * (height - 16);
                ctx.fillStyle = '#ff0033';
                ctx.fillRect(x, height - barHeight, barWidth - 2, Math.max(barHeight, 2));
                x += barWidth;
            }
        }

        drawVisualizer();

        /* --- IMAGE LOADER & REVEAL --- */
        window.addEventListener('DOMContentLoaded', () => {
            const imageSources = [
                "images/Eel 1.png",
                "images/Eel 2.png",
                "images/Eel 3.png"
            ];

            let loadedCount = 0;
            const totalImages = imageSources.length;
            const loaderBar = document.getElementById('loader-bar');

            imageSources.forEach(src => {
                const img = new Image();
                img.src = src;
                img.onload = img.onerror = () => {
                    loadedCount++;
                    loaderBar.style.width = (loadedCount / totalImages) * 100 + '%';
                    if (loadedCount >= totalImages) {
                        document.body.classList.add('images-loaded');
                    }
                };
            });
        });
    </script>
</body>
</html>
